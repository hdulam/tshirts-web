    <!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gracias | Cotización enviada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0d1f38;
      --navy-mid: #1a3356;
      --amber: #e8922a;
      --amber-light: #f5a94e;
      --cream: #f4f4f2;
      --gray-text: #6b6b6b;
      --border: rgba(13,31,56,0.1);
      --font-head: 'Figtree', sans-serif;
      --font-body: 'Figtree', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Glow igual a tu hero */
    body::before {
      content: '';
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(232,146,42,0.10) 0%, transparent 65%);
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 60px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease;
    }

    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      margin: 0 auto 24px;
      box-shadow: 0 10px 40px rgba(232,146,42,0.5);
    }

    h1 {
      font-family: var(--font-head);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    p {
      font-size: 15px;
      color: rgba(255,255,255,0.6);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-block;
      background: var(--amber);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.2s;
      box-shadow: 0 4px 20px rgba(232,146,42,0.4);
    }

    .btn:hover {
      background: #d47e1e;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(232,146,42,0.5);
    }

    .micro {
      margin-top: 18px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.4);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 24px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>

</head>

<body>

  <div class="card">
<div class="icon">✓</div>

<h1>¡404: Página no encontrada!</h1>

<p>
 Lo lamentamos, la página que buscas no existe.
</p>

<a href="index.html" class="btn">Volver al inicio</a>



  </div>

</body>
</html>

</body>
</html>
