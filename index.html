<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TShirts Guatemala — Próximamente</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#050b18;
  --navy:#0d1b2a;
  --soft:#12243d;
  --white:#f8fbff;
  --muted:#9fb3d1;
}

body{
  height:100vh;
  background: radial-gradient(circle at 50% 40%, #0f2547 0%, #050b18 70%);
  font-family:'Inter',sans-serif;
  color:var(--white);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* subtle noise */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:80px 80px;
  opacity:.4;
}

.wrap{
  text-align:center;
  animation:fade 1s ease forwards;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.brand{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.5rem,6vw,4rem);
  letter-spacing:.05em;
}

.brand span{
  display:block;
  font-size:.9rem;
  letter-spacing:.4em;
  margin-top:.6rem;
  color:var(--muted);
  font-family:'Inter',sans-serif;
}

.line{
  width:60px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--white),transparent);
  margin:2rem auto;
  opacity:.6;
}

.subtitle{
  font-size:.85rem;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:var(--muted);
}

.message{
  margin-top:3rem;
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:1.2rem;
  opacity:.7;
}

.footer{
  margin-top:3rem;
  font-size:.7rem;
  letter-spacing:.25em;
  text-transform:uppercase;
  opacity:.6;
}

.footer span{
  opacity:1;
}

/* elegant floating glow */
.glow{
  position:fixed;
  width:400px;
  height:400px;
  background:radial-gradient(circle, rgba(80,140,255,.15), transparent 70%);
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  filter:blur(60px);
  z-index:-1;
}

</style>
</head>

<body>

<div class="glow"></div>

<main class="wrap">

  <h1 class="brand">
    TSHIRTS
    <span>GUATEMALA</span>
  </h1>

  <div class="line"></div>

  <p class="message">Estamos construyendo algo grande.</p>

  <div class="footer">Tech by <span>HDULAM</span></div>

</main>

</body>
</html>
